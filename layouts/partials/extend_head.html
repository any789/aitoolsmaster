<style>
/* AI Tools Master v3 - FINAL */
:root {
  --accent: #ff6b35;
  --accent-hover: #ff8445;
  --accent-subtle: rgba(255, 107, 53, 0.08);
}

/* --- pure black everywhere --- */
body, .main, .post-single, .page, .list, .first-entry, .post-entry, article {
  background: #000000 !important;
}

/* --- nav --- */
.nav {
  background: rgba(0,0,0,0.85) !important;
  backdrop-filter: blur(24px);
  border-bottom: 1px solid rgba(255,255,255,0.04);
}
.nav a {
  color: rgba(255,255,255,0.45) !important;
  font-size: 0.82em !important;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.nav a:hover { color: #fff !important; }

/* --- home banner --- */
.home-info { padding: 56px 0 40px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.04); margin-bottom: 36px; }
.home-info h1 { font-size: 2.6em; font-weight: 700; letter-spacing: -0.04em; line-height: 1.12; }
.home-info p { color: rgba(255,255,255,0.45); font-size: 1em; max-width: 560px; margin: 0 auto; }

/* --- cards --- */
.post-entry {
  background: rgba(255,255,255,0.02) !important;
  border: 1px solid rgba(255,255,255,0.04) !important;
  border-radius: 16px !important;
  padding: 24px 28px !important;
  margin-bottom: 8px !important;
  transition: all 0.3s ease;
}
.post-entry:hover {
  background: rgba(255,255,255,0.03) !important;
  border-color: rgba(255,255,255,0.08) !important;
  transform: translateY(-2px);
}
.post-entry .entry-header h2 { font-size: 1.15em; font-weight: 550; color: #fff !important; letter-spacing: -0.015em; line-height: 1.35; }
.post-entry .entry-header h2 a { color: #fff !important; }
.post-entry .entry-content { color: rgba(255,255,255,0.4) !important; font-size: 0.88em; line-height: 1.6; }

/* --- meta --- */
.post-meta, .entry-footer { color: rgba(255,255,255,0.25) !important; font-size: 0.78em; }

/* --- TAGS - MUST BE ORANGE --- */
.post-tags a {
  background: transparent !important;
  color: var(--accent) !important;
  padding: 0 14px !important;
  border-radius: 100px !important;
  font-size: 14px !important;
  line-height: 34px !important;
  border: 1px solid rgba(255,255,255,0.08) !important;
}
.post-tags a:hover {
  border-color: var(--accent) !important;
}

/* --- links --- */
.post-content a { color: var(--accent); border-bottom: 1px solid transparent; text-decoration: none; }
.post-content a:hover { border-bottom-color: var(--accent); }

/* --- category badges --- */
.category-badge { border: 1px solid rgba(255,255,255,0.06); color: rgba(255,255,255,0.5); background: transparent; border-radius: 100px; padding: 5px 14px; font-size: 0.78em; transition: all 0.25s; }
.category-badge:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-subtle); }

/* --- TOC, code, blockquote accent --- */
.toc details summary { color: var(--accent) !important; }
.post-content code { color: var(--accent-hover) !important; }
.post-content blockquote { border-left-color: var(--accent) !important; background: var(--accent-subtle) !important; }

/* --- reading comfort --- */
.post-content { max-width: 720px; margin: 0 auto; }
.post-content p { color: rgba(255,255,255,0.75); line-height: 1.85; font-size: 1em; margin: 0.9em 0; }
.post-content strong { color: #fff; }
.post-content h1 { font-size: 2em; font-weight: 700; letter-spacing: -0.035em; }
.post-content h2 { font-size: 1.4em; font-weight: 600; letter-spacing: -0.025em; border-bottom: none; }
.post-content h3 { font-size: 1.1em; font-weight: 550; }
.post-content hr { border: none; height: 1px; background: rgba(255,255,255,0.04); margin: 2.4em 0; }
.post-content table { background: rgba(255,255,255,0.02); border-radius: 12px; overflow: hidden; }
.post-content th { background: rgba(255,255,255,0.04); color: #fff; border-bottom: 1px solid rgba(255,255,255,0.06); }
.post-content td { color: rgba(255,255,255,0.7); border-bottom: 1px solid rgba(255,255,255,0.03); }

/* --- toc --- */
.toc { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04); border-radius: 12px; padding: 16px 20px; }
.toc nav a { color: rgba(255,255,255,0.4); font-size: 0.85em; }
.toc nav a:hover { color: var(--accent); }

/* --- footer --- */
.footer { border-top: 1px solid rgba(255,255,255,0.04); padding: 28px 0; color: rgba(255,255,255,0.25); font-size: 0.8em; }

/* --- floating ads --- */
.ad-container { position: fixed; top: 25%; right: max(20px,calc((100vw - 1120px)/2 - 170px)); width: 140px; z-index: 999; display: flex; flex-direction: column; gap: 16px; }
@media (max-width: 1100px) { .ad-container { display: none; } }
.ad-unit { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04); border-radius: 10px; padding: 10px; text-align: center; min-height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ad-label { color: rgba(255,255,255,0.15); font-size: 0.6em; text-transform: uppercase; letter-spacing: 1.5px; }
.ad-placeholder { color: rgba(255,255,255,0.12); font-size: 0.78em; padding: 16px 0; }
.in-article-ad { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04); border-radius: 10px; padding: 20px; margin: 28px 0; text-align: center; min-height: 80px; display: flex; align-items: center; justify-content: center; }

/* --- pagination --- */
.paginav { margin: 36px 0; border-top: 1px solid rgba(255,255,255,0.04); padding-top: 24px; }
.paginav a { color: rgba(255,255,255,0.4); font-size: 0.85em; }
.paginav a:hover { color: var(--accent); }

/* --- scrollbar --- */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }

/* --- selection --- */
::selection { background: var(--accent); color: #fff; }

/* --- page title --- */
.page-title { font-size: 1.6em; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 28px; }

/* --- mobile --- */
@media (max-width: 768px) {
  .main { padding: 0 16px; }
  .home-info h1 { font-size: 1.7em; }
  .post-entry { padding: 18px 20px !important; }
  .post-content h1 { font-size: 1.4em; }
  .post-content h2 { font-size: 1.15em; }
}
</style>
